<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>التقاط صورتين — بموافقة صريحة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.2/peerjs.min.js"></script>
<style>
  :root{
    --bg:#0B1220; --panel:#121B2E; --panel-line:#1E2B45;
    --amber:#E8A33D; --teal:#3FA796; --danger:#D9634B;
    --text:#E7ECF3; --muted:#6B7A99;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);
    font-family:'IBM Plex Sans Arabic', system-ui, sans-serif;min-height:100vh;}
  .mono{font-family:'IBM Plex Mono', monospace;letter-spacing:0.02em;}
  .wrap{max-width:640px;margin:0 auto;padding:28px 20px 60px;}
  header{display:flex;align-items:center;gap:12px;margin-bottom:28px;}
  .dot{width:10px;height:10px;border-radius:50%;background:var(--muted);
    box-shadow:0 0 0 4px rgba(107,122,153,0.15);transition:all .3s;}
  .dot.live{background:var(--teal);box-shadow:0 0 0 4px rgba(63,167,150,0.2);
    animation:pulse 2s infinite;}
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:0.5;}}
  h1{font-size:19px;font-weight:600;margin:0;}
  .status-line{font-size:12px;color:var(--muted);margin-top:2px;}
  .panel{background:var(--panel);border:1px solid var(--panel-line);
    border-radius:14px;padding:22px;margin-bottom:16px;}
  .panel h2{font-size:11px;font-weight:600;margin:0 0 10px;color:var(--muted);
    text-transform:uppercase;letter-spacing:0.08em;}
  .link-box{display:flex;gap:8px;align-items:center;background:#0B1220;
    border:1px solid var(--panel-line);border-radius:10px;padding:10px 12px;}
  .link-box input{flex:1;background:none;border:none;color:var(--amber);
    font-size:13px;outline:none;}
  button{cursor:pointer;border:none;border-radius:10px;font-weight:600;
    font-family:inherit;font-size:14px;padding:12px 18px;transition:all .15s;}
  .btn-primary{background:var(--amber);color:#1a1206;width:100%;}
  .btn-primary:hover{filter:brightness(1.08);}
  .btn-primary:disabled{opacity:0.4;cursor:not-allowed;}
  .btn-copy{background:var(--panel-line);color:var(--text);padding:8px 12px;font-size:12px;}
  .btn-secondary{background:var(--panel-line);color:var(--text);width:100%;margin-top:8px;}
  .row2{display:flex;gap:8px;}
  .row2 button{flex:1;}
  .video-frame, .photo-frame{position:relative;border-radius:14px;overflow:hidden;
    background:#000;aspect-ratio:4/3;border:1px solid var(--panel-line);margin-bottom:14px;}
  .video-frame.connected, .photo-frame.filled{border-color:var(--teal);
    box-shadow:0 0 0 1px var(--teal), 0 0 24px rgba(63,167,150,0.15);}
  video,img{width:100%;height:100%;object-fit:cover;display:block;}
  video.mirror{transform:scaleX(-1);}
  .video-empty{position:absolute;inset:0;display:flex;align-items:center;
    justify-content:center;color:var(--muted);font-size:13px;text-align:center;padding:20px;}
  .step-label{font-size:11px;color:var(--amber);text-transform:uppercase;
    letter-spacing:0.08em;font-weight:600;margin-bottom:10px;}
  .gallery{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .gallery .photo-frame{margin-bottom:0;aspect-ratio:4/3;}
  .log{margin-top:14px;font-size:12px;color:var(--muted);line-height:1.9;
    max-height:120px;overflow-y:auto;}
  .log div span{color:var(--teal);}
  .notice{font-size:12.5px;color:var(--muted);line-height:1.8;padding:14px 16px;
    background:rgba(232,163,61,0.06);border:1px solid rgba(232,163,61,0.2);
    border-radius:10px;}
  .notice b{color:var(--amber);}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="dot" id="statusDot"></div>
    <div>
      <h1 id="title">جاري التجهيز...</h1>
      <div class="status-line mono" id="subtitle">—</div>
    </div>
  </header>

  <div id="app"></div>

  <div class="log mono" id="log"></div>
</div>

<script>
const $ = id => document.getElementById(id);
const log = msg => {
  const line = document.createElement('div');
  const t = new Date().toLocaleTimeString('ar-EG',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
  line.innerHTML = `<span>[${t}]</span> ${msg}`;
  $('log').prepend(line);
};
const setStatus = (title, sub, live=false) => {
  $('title').textContent = title;
  $('subtitle').textContent = sub;
  $('statusDot').classList.toggle('live', live);
};

const params = new URLSearchParams(location.hash.slice(1));
const joinId = params.get('join');

// STUN بس مش كفاية دايمًا (خصوصًا على نت الموبايل)، فبنضيف TURN احتياطي
// عشان نضمن إن الاتصال يعدي حتى لو الشبكتين صعبة.
const PEER_CONFIG = {
  config: {
    iceServers: [
      { urls: 'stun:stun.l.google.com:19302' },
      { urls: 'turn:openrelay.metered.ca:80', username: 'openrelayproject', credential: 'openrelayproject' },
      { urls: 'turn:openrelay.metered.ca:443', username: 'openrelayproject', credential: 'openrelayproject' },
      { urls: 'turn:openrelay.metered.ca:443?transport=tcp', username: 'openrelayproject', credential: 'openrelayproject' }
    ]
  }
};

if (!joinId) {
  // ---------- HOST MODE (receiver) ----------
  setStatus('استقبال الصور', 'بيتم إنشاء رابط دعوة آمن...');
  $('app').innerHTML = `
    <div class="panel">
      <h2>رابط الدعوة</h2>
      <div class="link-box">
        <input id="linkInput" readonly value="جاري الإنشاء...">
        <button class="btn-copy" id="copyBtn">نسخ</button>
      </div>
    </div>
    <div class="panel">
      <h2>الصور المستلمة</h2>
      <div class="gallery">
        <div class="photo-frame" id="frontFrame"><div class="video-empty">أمامية</div></div>
        <div class="photo-frame" id="backFrame"><div class="video-empty">خلفية</div></div>
      </div>
    </div>
    <div class="notice">
      ابعت الرابط ده للشخص اللي عايزه يبعتلك صورة أمامية وصورة خلفية. هو
      هيشوف معاينة حية لكل صورة قبل ما يبعتها، وهو اللي بيوافق ويأكد الإرسال
      بنفسه في كل خطوة.
    </div>
  `;

  const peer = new Peer(PEER_CONFIG);
  peer.on('open', id => {
    const link = `${location.origin}${location.pathname}#join=${id}`;
    $('linkInput').value = link;
    setStatus('استقبال الصور', 'الرابط جاهز — استناك للطرف التاني', false);
    log('تم إنشاء الجلسة، جاهز لاستقبال صور');
  });

  $('copyBtn').addEventListener('click', () => {
    navigator.clipboard.writeText($('linkInput').value);
    $('copyBtn').textContent = 'اتنسخ ✓';
    setTimeout(() => $('copyBtn').textContent = 'نسخ', 1500);
  });

  peer.on('connection', conn => {
    log('الطرف التاني اتصل');
    conn.on('error', err => log('خطأ في الاتصال: ' + err));
    conn.on('data', data => {
      if (data.type === 'photo') {
        const frame = data.which === 'front' ? $('frontFrame') : $('backFrame');
        frame.innerHTML = `<img src="${data.dataUrl}">`;
        frame.classList.add('filled');
        log(`وصلت الصورة ال${data.which === 'front' ? 'أمامية' : 'خلفية'}`);
        setStatus('بيتم الاستقبال', 'صورة جديدة وصلت', true);
      }
      if (data.type === 'done') {
        setStatus('اكتمل الإرسال', 'الطرف التاني بعت الصورتين وخلص', false);
        log('الطرف التاني أنهى الإرسال');
      }
    });
  });

  peer.on('error', err => log('خطأ: ' + err.type));

} else {
  // ---------- GUEST MODE (photo taker) ----------
  setStatus('التقاط الصور', 'مستني موافقتك عشان تبدأ');
  $('app').innerHTML = `
    <div class="notice" style="margin-bottom:16px;">
      هتاخد صورتين: <b>أمامية</b> ثم <b>خلفية</b>. قبل كل صورة هتشوف معاينة
      حية من الكاميرا، وتقدر تعيد المحاولة قد ما تحب قبل ما تأكد إرسالها.
      مفيش صورة بتتبعت من غير ما تدوس "إرسال" بنفسك.
    </div>
    <div class="panel">
      <div class="step-label" id="stepLabel">الخطوة ١ من ٢ — الصورة الأمامية</div>
      <div class="video-frame" id="frame">
        <div class="video-empty" id="empty">اضغط "بدء الكاميرا" عشان تشوف المعاينة</div>
        <video id="liveVideo" class="mirror" autoplay playsinline muted style="display:none;"></video>
        <img id="capturedImg" style="display:none;">
      </div>
      <canvas id="canvas" style="display:none;"></canvas>

      <button class="btn-primary" id="startBtn">بدء الكاميرا</button>

      <button class="btn-primary" id="captureBtn" style="display:none;">التقاط الصورة</button>

      <div class="row2" id="confirmRow" style="display:none;">
        <button class="btn-secondary" id="retakeBtn">إعادة المحاولة</button>
        <button class="btn-primary" id="sendBtn">إرسال هذه الصورة</button>
      </div>
    </div>
  `;

  const guestPeer = new Peer(PEER_CONFIG);
  let conn = null;
  let currentStream = null;
  let step = 'front'; // 'front' -> 'back' -> 'done'
  let capturedDataUrl = null;

  guestPeer.on('open', () => {
    conn = guestPeer.connect(joinId);
    conn.on('open', () => log('اتصلت بالطرف التاني'));
    conn.on('error', err => log('خطأ في الاتصال: ' + err));
  });
  guestPeer.on('error', err => log('خطأ: ' + err.type));

  async function startCamera(facing) {
    if (currentStream) currentStream.getTracks().forEach(t => t.stop());
    try {
      currentStream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: facing }, audio: false
      });
      const v = $('liveVideo');
      v.srcObject = currentStream;
      v.classList.toggle('mirror', facing === 'user');
      v.style.display = 'block';
      $('capturedImg').style.display = 'none';
      $('empty').style.display = 'none';
      $('startBtn').style.display = 'none';
      $('captureBtn').style.display = 'block';
      $('confirmRow').style.display = 'none';
      log('الكاميرا شغالة — المعاينة ظاهرة');
    } catch (e) {
      log('اتلغى فتح الكاميرا أو الإذن اترفض');
    }
  }

  $('startBtn').addEventListener('click', () => startCamera('user'));

  $('captureBtn').addEventListener('click', () => {
    const v = $('liveVideo');
    const canvas = $('canvas');
    canvas.width = v.videoWidth;
    canvas.height = v.videoHeight;
    const ctx = canvas.getContext('2d');
    if (step === 'front') { ctx.translate(canvas.width, 0); ctx.scale(-1, 1); }
    ctx.drawImage(v, 0, 0, canvas.width, canvas.height);
    capturedDataUrl = canvas.toDataURL('image/jpeg', 0.85);

    $('capturedImg').src = capturedDataUrl;
    $('capturedImg').style.display = 'block';
    v.style.display = 'none';
    $('captureBtn').style.display = 'none';
    $('confirmRow').style.display = 'flex';
    log('اتاخدت الصورة — راجعها قبل الإرسال');
  });

  $('retakeBtn').addEventListener('click', () => {
    startCamera(step === 'front' ? 'user' : 'environment');
  });

  $('sendBtn').addEventListener('click', () => {
    if (conn && conn.open) {
      conn.send({ type: 'photo', which: step, dataUrl: capturedDataUrl });
      log(`اتبعتت الصورة ال${step === 'front' ? 'أمامية' : 'خلفية'}`);
    }
    if (step === 'front') {
      step = 'back';
      $('stepLabel').textContent = 'الخطوة ٢ من ٢ — الصورة الخلفية';
      $('capturedImg').style.display = 'none';
      $('empty').style.display = 'flex';
      $('empty').textContent = 'اضغط "بدء الكاميرا" عشان تشوف المعاينة الخلفية';
      $('startBtn').style.display = 'block';
      $('confirmRow').style.display = 'none';
    } else {
      if (currentStream) currentStream.getTracks().forEach(t => t.stop());
      if (conn && conn.open) conn.send({ type: 'done' });
      setStatus('تم الإرسال', 'اتبعتت الصورتين بنجاح', false);
      $('app').insertAdjacentHTML('beforeend', `
        <div class="notice" style="margin-top:16px;">تم إرسال الصورتين. تقدر تقفل الصفحة دلوقتي.</div>
      `);
      $('captureBtn').style.display = 'none';
      $('confirmRow').style.display = 'none';
      $('startBtn').style.display = 'none';
      log('اكتمل الإرسال');
    }
  });
}
</script>
</body>
</html>
